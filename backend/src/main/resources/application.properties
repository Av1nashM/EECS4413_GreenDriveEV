spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/GreenDriveEV}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Identity / JWT (PB-21..23) ---
# No default on purpose: the app refuses to start without JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Origins allowed to call /api/v1/** from a browser (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://eecs4413-greendriveev-react.onrender.com,http://localhost:5173}
