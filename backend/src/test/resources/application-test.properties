# Used with @ActiveProfiles("test"). Overrides the main application.properties.
spring.datasource.url=jdbc:h2:mem:greendrive;MODE=PostgreSQL;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# main sets the PostgreSQL dialect; override it for H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-only-secret-test-only-secret-1234567890
app.jwt.expiration-minutes=15
app.cors.allowed-origins=https://eecs4413-greendriveev-react.onrender.com,http://localhost:5173
